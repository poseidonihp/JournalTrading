<div class="flex min-h-screen items-center justify-center px-4">
  <div class="panel w-full max-w-md rounded-xl px-8 pb-8 pt-9">
    <div class="mb-8 flex flex-col gap-1">
      <journal-brand-mark class="h-12 w-12" />
      <p class="mt-4 text-[13px]" style="color: var(--qp-mute)">Inicia sesión para continuar.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <journal-field label="Email" controlId="login-email">
        <input
          id="login-email"
          type="email"
          autocomplete="username"
          formControlName="email"
          class="field-input"
          aria-label="Email"
        />
      </journal-field>
      <journal-field label="Password" controlId="login-password">
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          class="field-input"
          aria-label="Password"
        />
      </journal-field>

      <journal-error-banner [message]="errorMessage()" />

      <journal-submit-button
        [loading]="submitting()"
        [disabled]="form.invalid"
        [icon]="iconLogin"
        label="Entrar"
        loadingLabel="Entrando…"
        extraClass="mt-2 justify-center"
      />
    </form>
  </div>
</div>
