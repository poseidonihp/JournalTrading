@if (model().isEmpty) {
  <div class="py-16 text-center text-sm" style="color: var(--qp-mute-2)">
    Sin trades en el año seleccionado.
  </div>
} @else {
  <div class="relative">
    <svg viewBox="0 0 1100 280" preserveAspectRatio="none" class="w-full h-[280px]">
      <defs>
        <linearGradient [attr.id]="'yc-pos-' + model().clipId" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--qp-sage)" stop-opacity="0.45" />
          <stop offset="100%" stop-color="var(--qp-sage)" stop-opacity="0.05" />
        </linearGradient>
        <linearGradient [attr.id]="'yc-neg-' + model().clipId" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--qp-clay)" stop-opacity="0.05" />
          <stop offset="100%" stop-color="var(--qp-clay)" stop-opacity="0.45" />
        </linearGradient>
        <clipPath [attr.id]="'yc-pos-clip-' + model().clipId">
          <rect x="0" y="0" width="1100" [attr.height]="model().zeroY" />
        </clipPath>
        <clipPath [attr.id]="'yc-neg-clip-' + model().clipId">
          <rect x="0" [attr.y]="model().zeroY" width="1100" [attr.height]="280 - model().zeroY" />
        </clipPath>
      </defs>

      @for (g of model().gridLines; track g.y) {
        <line
          x1="64"
          [attr.y1]="g.y"
          x2="1076"
          [attr.y2]="g.y"
          stroke="var(--qp-line)"
          stroke-opacity="0.45"
          stroke-dasharray="2 5"
          vector-effect="non-scaling-stroke"
        />
        <text x="58" [attr.y]="g.y + 3" font-size="10" text-anchor="end" fill="var(--qp-mute-2)">
          {{ g.label }}
        </text>
      }

      <line
        x1="64"
        [attr.y1]="model().zeroY"
        x2="1076"
        [attr.y2]="model().zeroY"
        stroke="var(--qp-line-strong)"
        stroke-width="1.25"
        vector-effect="non-scaling-stroke"
      />
      <text
        x="58"
        [attr.y]="model().zeroY + 3"
        font-size="10"
        text-anchor="end"
        font-weight="600"
        fill="var(--qp-mute-2)"
      >
        $0
      </text>

      @if (model().hasPositive) {
        <path
          [attr.d]="model().area"
          [attr.fill]="'url(#yc-pos-' + model().clipId + ')'"
          [attr.clip-path]="'url(#yc-pos-clip-' + model().clipId + ')'"
        />
      }
      @if (model().hasNegative) {
        <path
          [attr.d]="model().area"
          [attr.fill]="'url(#yc-neg-' + model().clipId + ')'"
          [attr.clip-path]="'url(#yc-neg-clip-' + model().clipId + ')'"
        />
      }

      <path
        [attr.d]="model().path"
        fill="none"
        stroke="var(--qp-ink)"
        stroke-width="2.2"
        stroke-linejoin="round"
        stroke-linecap="round"
        vector-effect="non-scaling-stroke"
      />

      @for (t of model().xTicks; track t.x) {
        <text [attr.x]="t.x" y="264" font-size="10" text-anchor="middle" fill="var(--qp-mute-2)">
          {{ t.label }}
        </text>
      }
    </svg>

    <div class="yc-overlay">
      @for (marker of model().markers; track marker.key) {
        <span
          class="yc-hit"
          data-test="div-yearlypoint-panel"
          [class.is-hovered]="hoveredKey() === marker.key"
          [class.is-empty]="!marker.hasTrades"
          [style.left.%]="marker.leftPct"
          [style.top.px]="marker.y"
          [style.color]="marker.positive ? 'var(--qp-sage)' : 'var(--qp-clay)'"
          (mouseenter)="hoveredKey.set(marker.key)"
          (mouseleave)="hoveredKey.set(null)"
        ></span>
      }
      @if (hoveredMarker(); as tip) {
        <div
          class="yc-tip"
          data-test="div-yearlytooltip-panel"
          [style.left.%]="tip.leftPct"
          [style.top.px]="tip.y"
          [style.transform]="tip.tipTransform"
        >
          <span class="yc-tip-title">{{ tip.monthLabel }}</span>
          <span
            class="yc-tip-value"
            [style.color]="tip.positive ? 'var(--qp-sage)' : 'var(--qp-clay)'"
            >{{ tip.netLabel }}</span
          >
          <span class="yc-tip-meta">Acum {{ tip.accumLabel }} · {{ tip.tradesLabel }}</span>
        </div>
      }
    </div>
  </div>
}
